name: Manter o vigia ativo

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  registrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Registrar atividade do mês
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > ultima-atividade.txt
          git config user.name "vigia"
          git config user.email "vigia@users.noreply.github.com"
          git add ultima-atividade.txt
          git commit -m "Registro mensal de atividade" || exit 0
          git push
